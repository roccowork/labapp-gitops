apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labapp
spec:
  ingressClassName: nginx
  rules:
    - host: labapp.local              # 按域名区分不同的应用
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: labapp
                port:
                  number: 80
